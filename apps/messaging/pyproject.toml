[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squire-messaging"
version = "0.1.0"
description = "Durable, recipient-scoped messaging gateway for Squire"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlmodel>=0.0.22,<1",
  "httpx>=0.27,<1", "pydantic-settings>=2.4,<3", "psycopg[binary]>=3.2,<4",
  "cryptography>=43,<50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "respx>=0.21,<1"]

[project.scripts]
squire-messaging-api = "messaging.server:main"
squire-messaging-migrate = "messaging.db:main"
squire-messaging-worker = "messaging.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/messaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
