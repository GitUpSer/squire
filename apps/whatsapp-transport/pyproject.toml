[project]
name = "squire-whatsapp-transport"
version = "0.1.0"
description = "Single-account wacli transport broker and durable journal capture"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
squire-whatsapp-transport = "whatsapp_transport.main:main"
squire-whatsapp-pair = "whatsapp_transport.pair:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
