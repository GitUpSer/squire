# Pilot proxy: control creates a non-resetting $10 sponsor team, then separate
# private/group virtual keys in that team. Runtime containers never get the
# Anthropic funding key or proxy master key. Unknown model aliases fail closed.
#
# $10 is a spending cutoff after completed requests, not a prepaid hard ceiling.
# In-flight requests and delayed spend updates can exceed it (see README.md).

# Explicit USD/token prices verified 2026-11-15 against Anthropic pricing:
# https://platform.claude.com/docs/en/about-claude/pricing
# Register every deployment hash, including cache rates; alias discovery alone
# does not guarantee spend accounting. Reverify whenever changing model pins.
model_list:
  # "trial-default" — the stable, proxy-owned model name. Use this if/when we
  # control the caller (e.g. any Squire-authored service that talks to the
  # proxy directly can just always ask for "trial-default" regardless of
  # what the real underlying model is, so we can swap the underlying model
  # here later without touching callers).
  - model_name: trial-default
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
      litellm_provider: anthropic
      input_cost_per_token: 0.000001000
      output_cost_per_token: 0.000005000
      cache_read_input_token_cost: 0.000000100
      cache_creation_input_token_cost: 0.000001250
      cache_creation_input_token_cost_above_1hr: 0.000002000

  # Hermes sends its configured provider:model verbatim. Keep both aliases,
  # tested against tenant-image/home-template/config.yaml. No wildcard routes.
  - model_name: "anthropic:claude-sonnet-5"
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
      litellm_provider: anthropic
      input_cost_per_token: 0.000002000
      output_cost_per_token: 0.000010000
      cache_read_input_token_cost: 0.000000200
      cache_creation_input_token_cost: 0.000002500
      cache_creation_input_token_cost_above_1hr: 0.000004000

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
      litellm_provider: anthropic
      input_cost_per_token: 0.000002000
      output_cost_per_token: 0.000010000
      cache_read_input_token_cost: 0.000000200
      cache_creation_input_token_cost: 0.000002500
      cache_creation_input_token_cost_above_1hr: 0.000004000

  # Haiku aliases retained: cheaper fallback we can flip tenants back to without
  # a proxy redeploy, and trial-default still points here for non-chat callers.
  # The alias production hits: hermes sends its configured `provider:model`
  # string verbatim as the request's `model` field.
  - model_name: "anthropic:claude-haiku-4-5"
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
      litellm_provider: anthropic
      input_cost_per_token: 0.000001000
      output_cost_per_token: 0.000005000
      cache_read_input_token_cost: 0.000000100
      cache_creation_input_token_cost: 0.000001250
      cache_creation_input_token_cost_above_1hr: 0.000002000

  # Bare-id alias, kept as forward-compatibility if hermes ever starts
  # stripping the provider prefix. Same Haiku pin, so it cannot fail open.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
      litellm_provider: anthropic
      input_cost_per_token: 0.000001000
      output_cost_per_token: 0.000005000
      cache_read_input_token_cost: 0.000000100
      cache_creation_input_token_cost: 0.000001250
      cache_creation_input_token_cost_above_1hr: 0.000002000

litellm_settings:
  callbacks: [pilot_limits.pilot_limits]
  turn_off_message_logging: true

general_settings:
  # Single process/replica pilot: bound concurrency and output (callback: 8192).
  # Distributed concurrency requires shared counters before adding replicas.
  max_parallel_requests: 1
  global_max_parallel_requests: 4
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keep upstream CLI Prisma migrations enabled on normal startup.
  disable_prisma_schema_update: false
  store_prompts_in_spend_logs: false
  allow_requests_on_db_unavailable: false
  # No budget_duration: the sponsor's $10 allowance never resets.
